<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小智 · 在这里，聊一聊</title><link rel="stylesheet" href="/ui/style.css"></head>
<body>
<header><a class="brand" href="/" aria-label="小智首页"><span class="brand-icon">知</span><span>小智<span class="brand-sub">你的语音助手</span></span></a><div class="statuses"><span id="service" class="status">服务连接中</span><span id="device" class="status">硬件状态查询中</span><button id="reconnect" class="quiet" title="重新连接服务">重连 ↗</button></div></header>
<main>
<section id="welcome"><div class="eyebrow"><span class="spark">✳</span> 随时开口，随心提问</div><h1>你好，我是小智。<br><span>很高兴见到你。</span></h1><p>有什么想问我的？<br>说出你的问题，或在下方输入文字。</p><div class="suggestions"><button data-prompt="用简单的话解释一下什么是人工智能。">聊聊新知 <span>↗</span></button><button data-prompt="给我三个适合工作间隙的放松方法。">找点灵感 <span>↗</span></button><button data-prompt="给我讲一个简短的有趣故事。">听个故事 <span>↗</span></button></div></section>
<section id="messages" aria-label="对话记录" aria-live="polite" aria-relevant="additions text"></section>
</main>
<div class="composer-wrap"><div id="notice" role="status">连接后即可开始对话</div><form id="composer"><textarea id="question" aria-label="向小智提问" placeholder="有什么想问小智的？" rows="1" maxlength="4000"></textarea><div class="composer-actions"><div><button type="button" id="mic" class="tool" disabled aria-label="开始语音输入"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 10v2a7 7 0 0014 0v-2M12 19v3m-4 0h8"/></svg><span>语音输入</span></button><button type="button" id="sound" class="tool" aria-pressed="true" title="切换语音朗读">◖)) <span>朗读开启</span></button></div><button type="button" id="stop" class="stop" hidden>停止回答 ■</button><button id="send" type="submit" disabled aria-label="发送问题">↑</button></div></form><footer><span id="model">小智语音助手</span><span>Enter 发送 · Shift + Enter 换行</span></footer></div>
